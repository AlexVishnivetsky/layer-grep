[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layergrep"
version = "0.1.0"
description = "Local semantic + literal code search (AST chunking, per-layer embeddings, MCP server) for an arbitrary project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter==0.23.2",
    "tree-sitter-python==0.23.6",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-rust==0.23.2",
    "tree-sitter-c==0.23.2",
    "tree-sitter-cpp==0.23.4",
    "sentence-transformers==3.0.1",
    "torch>=2.6.0",
    "sqlite-vec==0.1.9",
    "numpy==2.5.1",
    "tqdm==4.70.0",
    "mcp[cli]==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1", "ruff==0.16.0", "mypy==2.3.0", "bandit==1.9.4", "types-tqdm==4.70.0.20260731",
    "pre-commit==4.6.1",
]

# Two entry points, matching cli.py/mcp_server.py's own two usage modes (see PROJECT_STATUS.md):
# `layergrep` for direct human/script use, `layergrep-mcp-server` for .mcp.json's "command".
# This is what makes `uvx --from git+<repo-url> layergrep-mcp-server` (or, once published,
# `uvx layergrep-mcp-server`) work as a one-command install - no manual venv/pip step, no
# hardcoded venv path in .mcp.json (see PROJECT_STATUS.md's "MCP hang" section on why the
# venv-launcher path even mattered there in the first place).
[project.scripts]
layergrep = "cli:main"
layergrep-mcp-server = "mcp_server:main"

# No src/ package layout: every module lives flat at the repo root (chunker.py, indexer.py,
# etc.) and always has, imported directly by name (`import chunker`, not `from layergrep
# import chunker`) - changing that would mean rewriting every import across the whole project
# and every test's subprocess invocation (`python cli.py`/`python mcp_server.py` by file path).
# setuptools' py-modules packages flat single-file modules without requiring a package
# directory/__init__.py, exactly matching the layout that already exists.
[tool.setuptools]
py-modules = [
    "calibration", "chunker", "cli", "db_schema", "embed_check", "graph_analytics",
    "imports", "indexer", "init_wizard", "json_index", "mcp_server", "model_config",
    "project_config", "retrieval", "search",
]

# sqlite_vec ships no py.typed marker and no third-party stub package exists (unlike tqdm,
# covered by types-tqdm above) - ignore-missing-imports scoped to just this one module
# rather than project-wide, so a real missing-stub regression elsewhere still gets caught.
[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true
